name: Daily Macro Update

on:
  workflow_dispatch:
    inputs:
      force_navasan:
        description: 'Force refresh Navasan prices now (true/false)'
        required: false
        default: 'false'

concurrency:
  group: macro-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report generator
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NAVASAN_API_KEY: ${{ secrets.NAVASAN_API_KEY }}
          FORCE_NAVASAN: ${{ github.event.inputs.force_navasan }}
        run: python generate_report.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/history.json
          if [ -f data/markets_raw.json ]; then git add data/markets_raw.json; fi
          git diff --quiet --cached || git commit -m "Automated update"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            sleep 5
          done
